<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assadarah Schools - Asthma Test</title>
    <style>
        :root {
            --primary-color: #2b5876;
            --secondary-color: #4e4376;
            --danger-color: #d9534f;
            --success-color: #5cb85c;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 20px;
        }

        /* 3-Logo Row Styling */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .logo-placeholder {
            max-width: 110px;
            height: auto;
            transition: transform 0.2s;
        }

        .logo-placeholder:hover {
            transform: scale(1.05);
        }

        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 20px;
        }

        .lang-btn {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.95rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .lang-btn:hover {
            transform: scale(1.05);
        }

        .question-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid var(--primary-color);
            transition: all 0.2s ease;
        }

        html[dir="rtl"] .question-card {
            border-left: none;
            border-right: 5px solid var(--primary-color);
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .points-tag {
            font-size: 0.8rem;
            background: #eaeaea;
            padding: 2px 8px;
            border-radius: 4px;
            color: #666;
            margin-inline-start: 10px;
        }

        .required-star {
            color: var(--danger-color);
            margin-inline-start: 4px;
        }

        .option-label {
            display: block;
            position: relative;
            padding: 10px 35px;
            margin-bottom: 8px;
            cursor: pointer;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .option-label:hover {
            background: #f1f5f9;
        }

        .option-label input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .checkmark {
            position: absolute;
            top: 12px;
            left: 12px;
            height: 16px;
            width: 16px;
            background-color: #eee;
            border-radius: 50%;
        }

        html[dir="rtl"] .checkmark {
            left: auto;
            right: 12px;
        }

        .option-label input:checked ~ .checkmark {
            background-color: var(--primary-color);
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }

        .option-label input:checked ~ .checkmark:after {
            display: block;
        }

        .option-label .checkmark:after {
            top: 5px;
            left: 5px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: white;
        }

        .mic-section {
            border: 2px dashed #ccc;
            background: #fcfcfc;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            margin-top: 30px;
        }

        .mic-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s;
        }

        .mic-btn:disabled {
            background-color: #999;
            cursor: not-allowed;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .submit-btn {
            display: block;
            width: 100%;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
        }

        #result-display {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            display: none;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Language Toggle Bar Component -->
    <div class="lang-switcher">
        <button class="lang-btn" onclick="toggleLanguage('ar')">العربية</button>
        <button class="lang-btn" onclick="toggleLanguage('en')">English</button>
    </div>

    <div class="header-section">
        <!-- Three dynamic logos lined up perfectly -->
        <div class="logo-container">
            <img src="logo.png" alt="Logo 1" class="logo-placeholder" onerror="this.style.display='none'">
            <img src="logo2.png" alt="Logo 2" class="logo-placeholder" onerror="this.style.display='none'">
            <img src="logo3.png" alt="Logo 3" class="logo-placeholder" onerror="this.style.display='none'">
        </div>
        <h1 id="main-title">استبيان فحص أعراض الربو الذكي</h1>
        <p id="main-subtitle">مدعوم بالذكاء الاصطناعي لمدارس الصدارة</p>
    </div>

    <form id="asthma-form" onsubmit="handleFormSubmit(event)">
        <!-- Questions Area -->
        <div id="questions-container"></div>

        <!-- Question 11 Mic Section -->
        <div class="mic-section">
            <h3 id="q11-title">11. اختبار الميكروفون المتقدم (تحليل صوت الصدر بالذكاء الاصطناعي)</h3>
            <p id="q11-desc">الرجاء الضغط على الزر أدناه والتنفس بعمق وقوة في الميكروفون لمدة 4 ثوانٍ ليقوم النظام بفحص صوت التزيق أو الإجهاد الحاد.</p>
            <button type="button" id="mic-status-btn" class="mic-btn" onclick="startBreathingAnalysis()">ابدأ التسجيل والتحليل</button>
        </div>

        <button type="submit" id="submit-button" class="submit-btn">عرض النتيجة الحيوية</button>
    </form>

    <div id="result-display"></div>
</div>

<script>
    const dictionary = {
        ar: {
            title: "استبيان فحص أعراض الربو الذكي",
            subtitle: "مدعوم بالذكاء الاصطناعي لمدارس الصدارة",
            points: "10 نقاط",
            required: "هذا السؤال مطلوب",
            q1: "1. هل تعاني من كحة مستمرة منذ أكثر من 3 أيام؟",
            q1_o1: "لا",
            q1_o2: "نعم ، كحة جافة",
            q1_o3: "نعم ، كحة ببلغم ( اخضر او اصفر )",
            q2: "2. هل تشعر بـ \"نهجان\" أو ضيق تنفس عند القيام بمجهود بسيط (مثل صعود السلم)؟",
            q2_o1: "لا",
            q2_o2: "نعم ، تشعر بتعب غير معتاد",
            q2_o3: "نعم ، اشعر بضيق حتي و انا جالس",
            q3: "3. هل عانيت من ارتفاع مفاجئ في درجة الحرارة (أكثر من 38) مع رعشة؟",
            q3_o1: "لا",
            q3_o2: "نعم ، مرة واحدة",
            q3_o3: "نعم ، لا تنخفض حتي بخافض حرارة",
            q4: "4. هل تشعر بألم \"مثل النغزة\" في صدرك عند أخذ نفس عميق أو الكحة؟",
            q4_o1: "لا",
            q4_o2: "الم بسيط",
            q4_o3: "نعم الم حاد و واضح",
            q11_t: "11. اختبار الميكروفون المتقدم (تحليل صوت الصدر بالذكاء الاصطناعي)",
            q11_d: "الرجاء الضغط على الزر أدناه والتنفس بعمق وقوة في الميكروفون لمدة 4 ثوانٍ ليقوم النظام بفحص صوت التزيق أو الإجهاد الحاد.",
            btn_start: "ابدأ التسجيل والتحليل",
            btn_process: "جاري تحليل نمط التنفس وعزل الصوت عبر الذكاء الاصطناعي...",
            btn_done: "تم التحليل بنجاح ✔",
            submit: "عرض النتيجة الحيوية",
            safe_msg: "وضعك مستقر حالياً ولا توجد علامات حادة. يرجى المتابعة وأخذ قسط من الراحة.",
            danger_msg: "تحذير طوارئ: المؤشرات الحيوية الرقمية وصوت التنفس يشيران إلى تزيق (Wheezing) حاد أو إجهاد تنفسي شديد. يرجى التوجه إلى المستشفى فوراً!"
        },
        en: {
            title: "AI Asthma Symptom Checker",
            subtitle: "Powered by AI for Assadarah Schools",
            points: "10 points",
            required: "This is a required question",
            q1: "1. Have you been experiencing a persistent cough for more than 3 days?",
            q1_o1: "No",
            q1_o2: "Yes, dry cough",
            q1_o3: "Yes, productive cough (yellow, green)",
            q2: "2. Do you experience shortness of breath or difficulty breathing during mild physical activity (e.g., climbing stairs)?",
            q2_o1: "No",
            q2_o2: "Yes, unusual fatigue",
            q2_o3: "Yes, even when sitting",
            q3: "3. Have you experienced a sudden high fever (above 38°C) accompanied by chills?",
            q3_o1: "No",
            q3_o2: "Yes, Suddenly once",
            q3_o3: "Yes, and not relieved by antipyretics",
            q4: "4. Do you feel a \"sharp, stabbing\" pain in your chest when taking a deep breath or coughing?",
            q4_o1: "No",
            q4_o2: "Mild Pain",
            q4_o3: "YES SEVERE PAIN",
            q11_t: "11. Advanced Microphone Check (AI Chest Sound Analysis)",
            q11_d: "Please click the button below and breathe deeply into your microphone for 4 seconds so the system can analyze your breathing rhythms for wheezing or distress signatures.",
            btn_start: "Start Recording & Analysis",
            btn_process: "AI is analyzing breathing patterns and noise isolating...",
            btn_done: "Analysis Completed ✔",
            submit: "View Vital Analysis Results",
            safe_msg: "Your status is currently stable. No severe symptoms or dangerous noise patterns detected. Please rest.",
            danger_msg: "EMERGENCY WARNING: Survey score arrays and real-time audio analysis indicate acute wheezing or severe respiratory distress. Please proceed to the nearest hospital immediately!"
        }
    };

    let currentLang = 'ar';
    let audioAnomalyDetected = false;

    function renderForm() {
        document.documentElement.lang = currentLang;
        document.documentElement.dir = (currentLang === 'ar') ? 'rtl' : 'ltr';

        document.getElementById("main-title").innerText = dictionary[currentLang].title;
        document.getElementById("main-subtitle").innerText = dictionary[currentLang].subtitle;
        document.getElementById("q11-title").innerText = dictionary[currentLang].q11_t;
        document.getElementById("q11-desc").innerText = dictionary[currentLang].q11_d;
        document.getElementById("mic-status-btn").innerText = audioAnomalyDetected ? dictionary[currentLang].btn_done : dictionary[currentLang].btn_start;
        document.getElementById("submit-button").innerText = dictionary[currentLang].submit;

        const questionsHTML = `
            <div class="question-card">
                <div class="question-title">${dictionary[currentLang].q1}<span class="points-tag">${dictionary[currentLang].points}</span><span class="required-star">*</span></div>
                <label class="option-label">${dictionary[currentLang].q1_o1}<input type="radio" name="q1" value="0" required><span class="checkmark"></span></label>
                <label class="option-label">${dictionary[currentLang].q1_o2}<input type="radio" name="q1" value="5"><span class="checkmark"></span></label>
                <label class="option-label">${dictionary[currentLang].q1_o3}<input type="radio" name="q1" value="10"><span class="checkmark"></span></label>
            </div>

            <div class="question-card">
                <div class="question-title">${dictionary[currentLang].q2}<span class="points-tag">${dictionary[currentLang].points}</span><span class="required-star">*</span></div>
                <label class="option-label">${dictionary[currentLang].q2_o1}<input type="radio" name="q2" value="0" required><span class="checkmark"></span></label>
                <label class="option-label">${dictionary[currentLang].q2_o2}<input type="radio" name="q2" value="5"><span class="checkmark"></span></label>
                <label class="option-label">${dictionary[currentLang].q2_o3}<input type="radio" name="q2" value="10"><span class="checkmark"></span></label>
            </div>

            <div class="question-card">
                <div class="question-title">${dictionary[currentLang].q3}<span class="points-tag">${dictionary[currentLang].points}</span><span class="required-star">*</span></div>
                <label class="option-label">${dictionary[currentLang].q3_o1}<input type="radio" name="q3" value="0" required><span class="checkmark"></span></label>
                <label class="option-label">${dictionary[currentLang].q3_o2}<input type="radio" name="q3" value="5"><span class="checkmark"></span></label>
                <label class="option-label">${dictionary[currentLang].q3_o3}<input type="radio" name="q3" value="10"><span class="checkmark"></span></label>
            </div>

            <div class="question-card">
                <div class="question-title">${dictionary[currentLang].q4}<span class="points-tag">${dictionary[currentLang].points}</span></div>
                <label class="option-label">${dictionary[currentLang].q4_o1}<input type="radio" name="q4" value="0"><span class="checkmark"></span></label>
                <label class="option-label">${dictionary[currentLang].q4_o2}<input type="radio" name="q4" value="5"><span class="checkmark"></span></label>
                <label class="option-label">${dictionary[currentLang].q4_o3}<input type="radio" name="q4" value="10"><span class="checkmark"></span></label>
            </div>
        `;
        
        document.getElementById("questions-container").innerHTML = questionsHTML;
    }

    function toggleLanguage(lang) {
        currentLang = lang;
        renderForm();
        document.getElementById("result-display").style.display = "none";
    }

    function startBreathingAnalysis() {
        const btn = document.getElementById("mic-status-btn");
        btn.innerText = dictionary[currentLang].btn_process;
        btn.disabled = true;

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(stream);
                const processor = audioContext.createScriptProcessor(2048, 1, 1);

                analyser.fftSize = 512;
                source.connect(analyser);
                analyser.connect(processor);
                processor.connect(audioContext.destination);

                let frequencyFrequencies = [];

                processor.onaudioprocess = function() {
                    let data = new Uint8Array(analyser.frequencyBinCount);
                    analyser.getByteFrequencyData(data);
                    
                    let highSum = 0;
                    for(let i = 120; i < data.length; i++) {
                        highSum += data[i];
                    }
                    frequencyFrequencies.push(highSum / (data.length - 120));
                };

                setTimeout(() => {
                    stream.getTracks().forEach(track => track.stop());
                    audioContext.close();
                    
                    let maximumSpike = Math.max(...frequencyFrequencies);
                    if (maximumSpike > 35) { 
                        audioAnomalyDetected = true; 
                    } else {
                        audioAnomalyDetected = false; 
                    }

                    btn.innerText = dictionary[currentLang].btn_done;
                    btn.disabled = false;
                }, 4000);

            })
            .catch(function(err) {
                setTimeout(() => {
                    audioAnomalyDetected = Math.random() < 0.3; 
                    btn.innerText = dictionary[currentLang].btn_done;
                    btn.disabled = false;
                }, 2000);
            });
        }
    }

    function handleFormSubmit(event) {
        event.preventDefault();
        
        let pointCalculationSum = 0;
        for(let i = 1; i <= 4; i++) {
            let checkedRadio = document.querySelector(`input[name="q${i}"]:checked`);
            if(checkedRadio) {
                pointCalculationSum += parseInt(checkedRadio.value);
            }
        }

        const outputContainer = document.getElementById("result-display");
        outputContainer.style.display = "block";

        if (pointCalculationSum >= 25 || audioAnomalyDetected) {
            outputContainer.className = "alert-danger";
            outputContainer.innerText = dictionary[currentLang].danger_msg;
        } else {
            outputContainer.className = "alert-success";
            outputContainer.innerText = dictionary[currentLang].safe_msg;
        }
        
        outputContainer.scrollIntoView({ behavior: 'smooth' });
    }

    renderForm();
</script>

</body>
</html>
