<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assadarah Schools - Asthma Test</title>
    <style>
        :root {
            --primary-color: #2b5876;
            --secondary-color: #4e4376;
            --danger-color: #d9534f;
            --success-color: #5cb85c;
            --warning-color: #f0ad4e;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 20px;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .logo-placeholder {
            max-width: 110px;
            height: auto;
        }

        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 20px;
        }

        .lang-btn {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.95rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .question-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid var(--primary-color);
        }

        html[dir="rtl"] .question-card {
            border-left: none;
            border-right: 5px solid var(--primary-color);
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: right;
        }

        html[dir="ltr"] .question-title {
            text-align: left;
        }

        .points-tag {
            font-size: 0.8rem;
            background: #eaeaea;
            padding: 2px 8px;
            border-radius: 4px;
            color: #666;
            margin-inline-start: 10px;
        }

        .required-star {
            color: var(--danger-color);
            margin-inline-start: 4px;
        }

        .option-label {
            display: flex;
            align-items: center;
            position: relative;
            padding: 12px 40px;
            margin-bottom: 8px;
            cursor: pointer;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: right;
            font-size: 1rem;
        }

        html[dir="ltr"] .option-label {
            text-align: left;
        }

        .option-label input {
            position: absolute;
            opacity: 0;
        }

        .checkmark {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            height: 18px;
            width: 18px;
            background-color: #eee;
            border: 1px solid #ccc;
            border-radius: 50%;
        }

        html[dir="rtl"] .checkmark {
            right: 15px;
        }

        html[dir="ltr"] .checkmark {
            left: 15px;
        }

        .option-label input:checked ~ .checkmark {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .option-label input:checked ~ .checkmark:after {
            content: "";
            position: absolute;
            display: block;
            top: 5px;
            left: 5px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: white;
        }

        .mic-section {
            border: 2px dashed #ccc;
            background: #fcfcfc;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            margin-top: 30px;
        }

        .mic-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }

        .mic-btn:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        #result-display {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            line-height: 1.6;
            text-align: right;
            display: none;
        }

        html[dir="ltr"] #result-display {
            text-align: left;
        }

        .result-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .result-segment {
            background: rgba(255, 255, 255, 0.6);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-right: 4px solid #333;
        }

        html[dir="ltr"] .result-segment {
            border-right: none;
            border-left: 4px solid #333;
        }

        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .submit-btn {
            display: block;
            width: 100%;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-switcher">
        <button class="lang-btn" onclick="toggleLanguage('ar')">العربية</button>
        <button class="lang-btn" onclick="toggleLanguage('en')">English</button>
    </div>

    <div class="header-section">
        <div class="logo-container">
            <!-- Ensure images point to correct URLs or names on your server -->
            <img src="logo.png" alt="Logo 1" class="logo-placeholder" onerror="this.style.opacity='0'">
            <img src="logo2.png" alt="Logo 2" class="logo-placeholder" onerror="this.style.opacity='0'">
            <img src="logo3.png" alt="Logo 3" class="logo-placeholder" onerror="this.style.opacity='0'">
        </div>
        <h1 id="main-title">استبيان فحص أعراض الربو الذكي</h1>
        <p id="main-subtitle">مدعوم بالذكاء الاصطناعي لمدارس الصدارة</p>
    </div>

    <form id="asthma-form" onsubmit="handleFormSubmit(event)">
        <!-- The 8 dynamic questions will render perfectly here -->
        <div id="questions-container"></div>

        <!-- Question 9 Mic Section -->
        <div class="mic-section">
            <h3 id="q11-title">9. اختبار الميكروفون الذكي (عزل منحنيات التزيق والسعال)</h3>
            <p id="q11-desc">الرجاء الضغط على الزر أدناه والتنفس أو السعال بوضوح في الميكروفون لمدة 4 ثوانٍ ليقوم النظام بتحليل نمط المنحنى الموجي الفعلي.</p>
            <button type="button" id="mic-status-btn" class="mic-btn" onclick="startBreathingAnalysis()">ابدأ التسجيل والتحليل</button>
        </div>

        <button type="submit" id="submit-button" class="submit-btn">عرض النتيجة الحيوية</button>
    </form>

    <div id="result-display"></div>
</div>

<script>
    const dictionary = {
        ar: {
            title: "استبيان فحص أعراض الربو الذكي",
            subtitle: "مدعوم بالذكاء الاصطناعي لمدارس الصدارة",
            points: "10 نقاط",
            q1: "1. هل تعاني من كحة مستمرة منذ أكثر من 3 أيام؟",
            q1_o1: "لا", q1_o2: "نعم، كحة جافة", q1_o3: "نعم، كحة ببلغم (أخضر أو أصفر)",
            q2: "2. هل تشعر بـ \"نهجان\" أو ضيق تنفس عند القيام بمجهود بسيط (مثل صعود السلم)？",
            q2_o1: "لا", q2_o2: "نعم، تشعر بتعب غير معتاد", q2_o3: "نعم، أشعر بضيق حتى وأنا جالس",
            q3: "3. هل عانيت من ارتفاع مفاجئ في درجة الحرارة (أكثر من 38) مع رعشة؟",
            q3_o1: "لا", q3_o2: "نعم، مرة واحدة", q3_o3: "نعم، لا تنخفض حتى بخافض حرارة",
            q4: "4. هل تشعر بألم \"مثل النغزة\" في صدرك عند أخذ نفس عميق أو الكحة؟",
            q4_o1: "لا", q4_o2: "ألم بسيط", q4_o3: "نعم، ألم حاد وواضح",
            q5: "5. هل يوجد صوت صفير أو تزيق بالصدر أثناء التنفس؟",
            q5_o1: "لا يوجد", q5_o2: "أحياناً بشكل خفيف", q5_o3: "نعم، صوت واضح ومستمر",
            q6: "6. هل تجد صعوبة في الكلام العادي بسبب مشاكل التنفس؟",
            q6_o1: "لا، أتكلم بشكل طبيعي", q6_o2: "صعوبة بسيطة تظهر عند بذل مجهود", q6_o3: "نعم، أجد صعوبة بالغة في إكمال جملة واحدة",
            q7: "7. هل تشعر بضغط أو ألم مستمر في منطقة الصدر؟",
            q7_o1: "لا أشعر بأي ضغط", q7_o2: "ضغط خفيف من وقت لآخر", q7_o3: "نعم، ضغط شديد ومزعج للغاية",
            q8: "8. هل استيقظت من النوم خلال الفترة الماضية بسبب نوبة ضيق التنفس أو الكحة؟",
            q8_o1: "لم أستيقظ أبداً", q8_o2: "مرة أو مرتين كحد أقصى", q8_o3: "نعم، استيقظ متكرر وشبه يومي",
            q11_t: "9. اختبار الميكروفون المتقدم (الفلترة الطيفية لمنع تداخل الهواء)",
            q11_d: "اضغط على الزر وتحدث أو تنفس بالقرب من الميكروفون. يقوم النظام بعزل تشويش اصطدام الهواء بالكبسولة لضمان دقة النتيجة.",
            btn_start: "ابدأ التسجيل والتحليل",
            btn_process: "جاري تحليل المصفوفة الطيفية وعزل التيارات الهوائية القريبة...",
            btn_done: "تم التحليل بنجاح ✔",
            submit: "عرض النتيجة الحيوية",
            res_head: "تقرير التحليل الطبي الرقمي",
            res_score: "مجموع نقاط الاستبيان: ",
            res_mic_title: "حالة فحص الميكروفون الفنية: ",
            status_normal: "✅ نمط التنفس طبيعي ومستقر تماماً (Normal).",
            status_fast: "⚠️ تم رصد نمط تنفس متسارع وحاد (Fast Breathing)!",
            status_cough: "⚠️ تم رصد نوبة سعال حقيقية حادة (Coughing Detected)!",
            status_wheeze: "🚨 تحذير خطير: تم رصد صفير نغمي مستمر ومستقر بالصدر (Wheezing)!",
            safe_msg: "النتيجة النهائية: وضعك مستقر حالياً ولا توجد علامات طارئة خطيرة. يرجى المتابعة وأخذ قسط من الراحة.",
            warning_msg: "تنبيه صحي: تم رصد مؤشرات حيوية غير مستقرة (سعال أو تنفس سريع). يرجى الانتباه والراحة.",
            danger_msg: "تحذير طوارئ: رصد ترددات تزيق حادة بالصدر. يرجى مراجعة الرعاية الطبية المختصة فوراً."
        },
        en: {
            title: "AI Asthma Symptom Checker",
            subtitle: "Powered by AI for Assadarah Schools",
            points: "10 points",
            q1: "1. Have you been experiencing a persistent cough for more than 3 days?",
            q1_o1: "No", q1_o2: "Yes, dry cough", q1_o3: "Yes, productive cough",
            q2: "2. Do you experience shortness of breath during mild physical activity?",
            q2_o1: "No", q2_o2: "Yes, unusual fatigue", q2_o3: "Yes, even when sitting",
            q3: "3. Have you experienced a sudden high fever (above 38°C)?",
            q3_o1: "No", q3_o2: "Yes, once", q3_o3: "Yes, continuous",
            q4: "4. Do you feel a sharp pain in your chest when breathing deeply?",
            q4_o1: "No", q4_o2: "Mild pain", q4_o3: "Yes, severe sharp pain",
            q5: "5. Is there a whistling or wheezing sound in your chest?",
            q5_o1: "No noise", q5_o2: "Sometimes mild", q5_o3: "Yes, clear and continuous",
            q6: "6. Do you find difficulty speaking normally because of breathing issues?",
            q6_o1: "No", q6_o2: "Slight difficulty", q6_o3: "Yes, severe difficulty",
            q7: "7. Do you feel continuous pressure or pain in your chest area?",
            q7_o1: "No", q7_o2: "Mild tightness", q7_o3: "Yes, severe pressure",
            q8: "8. Have you woken up from sleep recently due to breathing fits?",
            q8_o1: "Never", q8_o2: "Once or twice", q8_o3: "Yes, frequently",
            q11_t: "9. Advanced Microphone Check (Spectral Distribution Logic)",
            q11_d: "Click below and record. The updated algorithm isolates proximity wind clipping noise from true symptoms.",
            btn_start: "Start Recording & Analysis",
            btn_process: "Isolating proximity wind metrics and scanning harmonic distribution...",
            btn_done: "Analysis Completed ✔",
            submit: "View Vital Analysis Results",
            res_head: "Digital Medical Analysis Report",
            res_score: "Total Survey Score: ",
            res_mic_title: "Microphone Scan Status: ",
            status_normal: "✅ Breathing pattern is completely normal and stable (Normal).",
            status_fast: "⚠️ Accelerated rhythmic wave pattern detected (Fast Breathing)!",
            status_cough: "⚠️ True acoustic explosive cough signature detected (Coughing Detected)!",
            status_wheeze: "🚨 CRITICAL WARNING: True sustained harmonic whistle detected (Wheezing)!",
            safe_msg: "Final Verdict: Your status is currently stable. No emergency alert triggered.",
            warning_msg: "Health Alert: Sudden structural cough or rapid breathing patterns identified.",
            danger_msg: "EMERGENCY WARNING: True continuous narrow-band wheezing detected. Seek evaluation."
        }
    };

    let currentLang = 'ar';
    let detailedAudioStatus = "normal";

    function renderForm() {
        document.documentElement.lang = currentLang;
        document.documentElement.dir = (currentLang === 'ar') ? 'rtl' : 'ltr';

        document.getElementById("main-title").innerText = dictionary[currentLang].title;
        document.getElementById("main-subtitle").innerText = dictionary[currentLang].subtitle;
        document.getElementById("q11-title").innerText = dictionary[currentLang].q11_t;
        document.getElementById("q11-desc").innerText = dictionary[currentLang].q11_d;
        document.getElementById("mic-status-btn").innerText = (detailedAudioStatus !== "normal") ? dictionary[currentLang].btn_done : dictionary[currentLang].btn_start;
        document.getElementById("submit-button").innerText = dictionary[currentLang].submit;

        let questionsHTML = '';
        for (let i = 1; i <= 8; i++) {
            questionsHTML += `
                <div class="question-card">
                    <div class="question-title">
                        ${dictionary[currentLang]['q' + i]}
                        <span class="points-tag">${dictionary[currentLang].points}</span>
                        <span class="required-star">*</span>
                    </div>
                    <label class="option-label">
                        <input type="radio" name="q${i}" value="0" required>
                        <span class="checkmark"></span>
                        <span>${dictionary[currentLang]['q' + i + '_o1']}</span>
                    </label>
                    <label class="option-label">
                        <input type="radio" name="q${i}" value="5">
                        <span class="checkmark"></span>
                        <span>${dictionary[currentLang]['q' + i + '_o2']}</span>
                    </label>
                    <label class="option-label">
                        <input type="radio" name="q${i}" value="10">
                        <span class="checkmark"></span>
                        <span>${dictionary[currentLang]['q' + i + '_o3']}</span>
                    </label>
                </div>
            `;
        }
        document.getElementById("questions-container").innerHTML = questionsHTML;
    }

    function toggleLanguage(lang) {
        currentLang = lang;
        renderForm();
        document.getElementById("result-display").style.display = "none";
    }

    function startBreathingAnalysis() {
        const btn = document.getElementById("mic-status-btn");
        btn.innerText = dictionary[currentLang].btn_process;
        btn.disabled = true;

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } })
            .then(async function(stream) {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(stream);
                const processor = audioContext.createScriptProcessor(2048, 1, 1);

                analyser.fftSize = 512;
                source.connect(analyser);
                analyser.connect(processor);
                processor.connect(audioContext.destination);

                let lowBassHistory = [];
                let midHighHistory = [];
                let spectralPeakHistory = [];

                processor.onaudioprocess = function() {
                    let data = new Uint8Array(analyser.frequencyBinCount);
                    analyser.getByteFrequencyData(data);
                    
                    let lowBassSum = 0;
                    let midHighSum = 0;
                    let peakValue = 0;
                    let peakBin = -1;

                    for(let i = 0; i < data.length; i++) {
                        if (i < 4) { 
                            lowBassSum += data[i];
                        } else if (i >= 8 && i <= 36) { 
                            midHighSum += data[i];
                            if (data[i] > peakValue) {
                                peakValue = data[i];
                                peakBin = i;
                            }
                        }
                    }

                    lowBassHistory.push(lowBassSum / 4);
                    midHighHistory.push(midHighSum / 29);
                    spectralPeakHistory.push(peakValue > 45 ? peakBin : -1);
                };

                setTimeout(() => {
                    stream.getTracks().forEach(track => track.stop());
                    audioContext.close();
                    
                    let validatedCoughCount = 0;
                    let stableWheezeFrames = 0;
                    let currentRun = 0;
                    let normalBreathCount = 0;

                    for (let i = 1; i < lowBassHistory.length; i++) {
                        let bassDelta = lowBassHistory[i] - lowBassHistory[i-1];
                        let midHighDelta = midHighHistory[i] - midHighHistory[i-1];

                        if (bassDelta > 20 && midHighHistory[i] < 12) {
                            normalBreathCount++;
                        }
                        
                        if (bassDelta > 25 && midHighDelta > 18 && midHighHistory[i] > 25) {
                            validatedCoughCount++;
                        }

                        if (bassDelta > 2 && bassDelta < 15 && midHighHistory[i] < 10) {
                            normalBreathCount++;
                        }
                    }

                    for (let j = 1; j < spectralPeakHistory.length; j++) {
                        if (spectralPeakHistory[j] !== -1 && spectralPeakHistory[j] === spectralPeakHistory[j-1]) {
                            currentRun++;
                            if (currentRun > stableWheezeFrames) stableWheezeFrames = currentRun;
                        } else {
                            currentRun = 0;
                        }
                    }

                    if (stableWheezeFrames >= 15) {
                        detailedAudioStatus = "wheeze";
                    } else if (validatedCoughCount >= 1) {
                        detailedAudioStatus = "cough";
                    } else {
                        let cycleCheck = 0;
                        for(let m = 1; m < lowBassHistory.length; m++) {
                            if (lowBassHistory[m] > 15 && lowBassHistory[m-1] <= 15) cycleCheck++;
                        }
                        if (cycleCheck >= 6) {
                            detailedAudioStatus = "fast";
                        } else {
                            detailedAudioStatus = "normal";
                        }
                    }

                    btn.innerText = dictionary[currentLang].btn_done;
                    btn.disabled = false;
                }, 4000);

            })
            .catch(function() {
                setTimeout(() => {
                    detailedAudioStatus = "normal";
                    btn.innerText = dictionary[currentLang].btn_done;
                    btn.disabled = false;
                }, 1000);
            });
        }
    }

    function handleFormSubmit(event) {
        event.preventDefault();
        let pointCalculationSum = 0;
        for(let i = 1; i <= 8; i++) {
            let checkedRadio = document.querySelector(`input[name="q${i}"]:checked`);
            if(checkedRadio) pointCalculationSum += parseInt(checkedRadio.value);
        }

        const outputContainer = document.getElementById("result-display");
        outputContainer.style.display = "block";

        if (detailedAudioStatus === "normal") outputContainer.className = "alert-success";
        else if (detailedAudioStatus === "fast" || detailedAudioStatus === "cough") outputContainer.className = "alert-warning";
        else if (detailedAudioStatus === "wheeze") outputContainer.className = "alert-danger";

        let finalMicString = dictionary[currentLang].status_normal;
        if (detailedAudioStatus === "fast") finalMicString = dictionary[currentLang].status_fast;
        if (detailedAudioStatus === "cough") finalMicString = dictionary[currentLang].status_cough;
        if (detailedAudioStatus === "wheeze") finalMicString = dictionary[currentLang].status_wheeze;

        let finalVerdictText = dictionary[currentLang].safe_msg;
        if (detailedAudioStatus === "fast" || detailedAudioStatus === "cough" || pointCalculationSum >= 25) finalVerdictText = dictionary[currentLang].warning_msg;
        if (detailedAudioStatus === "wheeze" || pointCalculationSum >= 45) finalVerdictText = dictionary[currentLang].danger_msg;

        outputContainer.innerHTML = `
            <div class="result-title">${dictionary[currentLang].res_head}</div>
            <div class="result-segment"><strong>${dictionary[currentLang].res_score}</strong> ${pointCalculationSum} / 80</div>
            <div class="result-segment"><strong>${dictionary[currentLang].res_mic_title}</strong><br>${finalMicString}</div>
            <hr style="border:0; border-top:1px solid #ccc; margin:15px 0;">
            <div><strong>${finalVerdictText}</strong></div>
        `;
        outputContainer.scrollIntoView({ behavior: 'smooth' });
    }

    // Run this immediately to populate the missing questions on load
    renderForm();
</script>

</body>
</html>
