<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assadarah Schools - Asthma Test</title>
    <style>
        :root {
            --primary-color: #2b5876;
            --secondary-color: #4e4376;
            --danger-color: #d9534f;
            --success-color: #5cb85c;
            --warning-color: #f0ad4e;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 20px;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .logo-placeholder {
            max-width: 110px;
            height: auto;
        }

        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 20px;
        }

        .lang-btn {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.95rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .question-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid var(--primary-color);
        }

        html[dir="rtl"] .question-card {
            border-left: none;
            border-right: 5px solid var(--primary-color);
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .points-tag {
            font-size: 0.8rem;
            background: #eaeaea;
            padding: 2px 8px;
            border-radius: 4px;
            color: #666;
            margin-inline-start: 10px;
        }

        .required-star {
            color: var(--danger-color);
            margin-inline-start: 4px;
        }

        .option-label {
            display: block;
            position: relative;
            padding: 10px 35px;
            margin-bottom: 8px;
            cursor: pointer;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .option-label input {
            position: absolute;
            opacity: 0;
        }

        .checkmark {
            position: absolute;
            top: 12px;
            left: 12px;
            height: 16px;
            width: 16px;
            background-color: #eee;
            border-radius: 50%;
        }

        html[dir="rtl"] .checkmark {
            left: auto;
            right: 12px;
        }

        .option-label input:checked ~ .checkmark {
            background-color: var(--primary-color);
        }

        .mic-section {
            border: 2px dashed #ccc;
            background: #fcfcfc;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            margin-top: 30px;
        }

        .mic-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }

        .mic-btn:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        #result-display {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            line-height: 1.6;
            text-align: right;
            display: none;
        }

        html[dir="ltr"] #result-display {
            text-align: left;
        }

        .result-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .result-segment {
            background: rgba(255, 255, 255, 0.6);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-right: 4px solid #333;
        }

        html[dir="ltr"] .result-segment {
            border-right: none;
            border-left: 4px solid #333;
        }

        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .submit-btn {
            display: block;
            width: 100%;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
        }
    </style>
</head>

<div class="container">
    <div class="lang-switcher">

    </div>

    <div class="header-section">
        <div class="logo-container">
            <img src="logo.png" alt="Logo 1" class="logo-placeholder" onerror="this.style.display='none'">
            <img src="logo2.png" alt="Logo 2" class="logo-placeholder" onerror="this.style.display='none'">
            <img src="logo3.png" alt="Logo 3" class="logo-placeholder" onerror="this.style.display='none'">
        </div>
        <h1 id="main-title">استبيان فحص أعراض الربو الذكي</h1>
        <p id="main-subtitle">مدعوم بالذكاء الاصطناعي لمدارس الصدارة</p>
    </div>

    <form id="asthma-form" onsubmit="handleFormSubmit(event)">
        <div id="questions-container"></div>

            <button type="button" id="mic-status-btn" class="mic-btn" onclick="startBreathingAnalysis()">ابدأ التسجيل والتحليل</button>
        </div>

        <button type="submit" id="submit-button" class="submit-btn">عرض النتيجة الحيوية</button>
    </form>

    <div id="result-display"></div>
</div>
